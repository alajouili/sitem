apiVersion: v1
kind: ServiceAccount
metadata:
  name: sitem-app-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitem.labels" . | nindent 4 }}
  # Deliberately no Role/RoleBinding bound to this identity —
  # zero Kubernetes API permissions, since the app never needs to
  # call the K8s API. Same least-privilege principle as
  # `USER www-data` in backend/Dockerfile.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sitem-readonly-sa
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitem.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: sitem-viewer
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitem.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods", "services", "configmaps", "pods/log"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: sitem-viewer-binding
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitem.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: sitem-readonly-sa
    namespace: {{ .Values.namespace }}
roleRef:
  kind: Role
  name: sitem-viewer
  apiGroup: rbac.authorization.k8s.io