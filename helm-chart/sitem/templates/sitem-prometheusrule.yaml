apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: sitem-alerts
  namespace: monitoring
  labels:
    # kube-prometheus-stack's Prometheus only picks up PrometheusRule
    # resources carrying this specific label — without it, this file
    # applies successfully but Prometheus silently ignores it. Check
    # your actual value with:
    #   kubectl get prometheus -n monitoring -o yaml | Select-String "ruleSelector" -Context 0,5
    release: kube-prometheus-stack
spec:
  groups:
    - name: sitem.rules
      rules:
        # Directly models today's incident: a Deployment stuck with
        # unavailable replicas for an extended period. "for: 5m"
        # means this only fires if the condition is SUSTAINED, not
        # a brief blip — avoiding alert fatigue from normal rollout
        # transitions.
        - alert: SitemDeploymentDegraded
          expr: |
            kube_deployment_status_replicas_available{namespace="sitem"}
            < kube_deployment_spec_replicas{namespace="sitem"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.deployment }} has fewer available replicas than desired"
            description: "This is exactly the pattern behind the Phase 7 incident — a stuck rollout leaving a Deployment degraded without anyone noticing until someone happened to check."

        # Catches ImagePullBackOff / CrashLoopBackOff — the second
        # real root cause we hit (bad token scope, missing RBAC).
        - alert: SitemPodNotReady
          expr: |
            kube_pod_status_ready{namespace="sitem", condition="false"} == 1
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "Pod {{ $labels.pod }} in sitem has not become ready"
            description: "Check `kubectl describe pod {{ $labels.pod }} -n sitem` — common causes we've hit: image pull auth failures, missing ServiceAccount."

        # HPA hitting its ceiling is a genuine capacity signal — the
        # kind of thing that SHOULD page someone in a real system
        # serving real traffic, not just sit in a dashboard.
        - alert: SitemHPAAtMaxReplicas
          expr: |
            kube_horizontalpodautoscaler_status_current_replicas{namespace="sitem"}
            >= kube_horizontalpodautoscaler_spec_max_replicas{namespace="sitem"}
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.horizontalpodautoscaler }} is at max replicas"
            description: "Sustained high load — worth reviewing whether maxReplicas needs raising, or whether something is consuming more CPU than expected."