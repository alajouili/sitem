apiVersion: v1
kind: Secret
metadata:
  name: sitem-secrets
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "sitem.labels" . | nindent 4 }}
type: Opaque
stringData:
  # stringData (not "data") lets us write plain text here — Helm/
  # Kubernetes handles the base64 encoding automatically. Values
  # come from .Values.secrets.*, which are EMPTY by default in the
  # committed values.yaml. Real values must be supplied at install
  # time, e.g.:
  #   helm install sitem ./sitem \
  #     --set secrets.dbPassword=$env:DB_PASSWORD \
  #     --set secrets.dbRootPassword=$env:DB_ROOT_PASSWORD \
  #     --set secrets.jwtSecret=$env:JWT_SECRET
  # This is the exact same discipline as .env and the imperative
  # `kubectl create secret` command from Phase 5 — never a real
  # secret value sitting in a file that could be committed.
  DB_PASSWORD: {{ .Values.secrets.dbPassword | quote }}
  DB_ROOT_PASSWORD: {{ .Values.secrets.dbRootPassword | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}